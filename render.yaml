envVarGroups:
  - name: nozanin-common
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PRODUCT_CHAT_IDS
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: DAILY_REPORT_HOUR
        value: "21"
      - key: DAILY_REPORT_MINUTE
        value: "0"

services:
  - type: web
    runtime: docker
    name: nozanin-api
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: nozanin-common
      - key: DATABASE_URL
        fromDatabase:
          name: nozanin-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    runtime: docker
    name: nozanin-bot
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile.bot.web
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - fromGroup: nozanin-common
      - key: DATABASE_URL
        fromDatabase:
          name: nozanin-db
          property: connectionString

databases:
  - name: nozanin-db
    plan: free
    region: frankfurt
    databaseName: nozanin
    user: nozanin
    postgresMajorVersion: "18"
