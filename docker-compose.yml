services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend:ro
    restart: unless-stopped

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - api
    restart: unless-stopped

  # Frontend (Mini App) — statik fayl, istalgan statik hosting yoki nginx orqali beriladi
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
